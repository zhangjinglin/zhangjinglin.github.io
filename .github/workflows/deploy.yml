name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.168.0
      DART_SASS_VERSION: 1.106.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo (extended) and Dart Sass
        run: |
          set -euo pipefail

          echo "=== 安装 Hugo extended ==="
          curl -fsSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          sudo chmod 755 /usr/local/bin/hugo

          echo "=== 安装 Dart Sass（官方二进制）==="
          curl -fsSL -o /tmp/dart-sass.tar.gz \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          sudo tar -xzf /tmp/dart-sass.tar.gz -C /opt
          sudo ln -sf /opt/dart-sass/sass /usr/local/bin/sass
          sudo chmod 755 /opt/dart-sass/sass /opt/dart-sass/src/dart

          echo "=== 版本确认 ==="
          hugo version
          sass --version
          echo "hugo: $(command -v hugo)"
          echo "sass: $(command -v sass) -> $(readlink -f $(command -v sass))"

      - name: Build
        run: |
          set -euo pipefail
          hugo --gc --minify --baseURL "https://zhangjinglin.github.io/"
          echo "构建完成，文件数：$(find public -type f | wc -l)"

      - name: Deploy to master
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy: ${{ github.event.head_commit.message }}'
