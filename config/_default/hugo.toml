# -------------------------------------------------------------------------------------
# Hugo Configuration
# See: https://gohugo.io/configuration/all/
# -------------------------------------------------------------------------------------

# Website title.
title = "张景林的博客"
# Hostname (and path) to the root.
baseURL = "https://zhangjinglin.github.io/"
# Theme list.
theme = ["FixIt"]
# Determines default content language.
defaultContentLanguage = "zh-cn"
# Language code.
locale = "zh-CN"
# Language name.
label = "简体中文"
# Whether to include Chinese/Japanese/Korean.
hasCJKLanguage = true
# Timezone local.
timeZone = "Asia/Shanghai"
# Copyright description used only for SEO schema.
copyright = ""
# Whether to use robots.txt.
enableRobotsTXT = true
# Whether to use git commit log.
enableGitInfo = true
# Whether to use emoji code.
enableEmoji = true
# The capitalization rules to follow.
titleCaseStyle = "none"
# Whether to capitalize automatic list titles.
capitalizeListTitles = false
# The main sections of a site.
mainSections = ["posts"]
# The editor to use when creating new content.
newContentEditor = "code"
# Ignore some build warnings and errors.
ignoreLogs = []
